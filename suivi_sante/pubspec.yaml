   # ✅ Ajouter cette ligne
  flutter_launcher_icons: ^0.13.1

# ✅ Configuration des icônes
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

  #flutter_animate: ^4.1.1  # ← AJOUTER

  

flutter:
  uses-material-design: true  # ⚠️ ASSUREZ-VOUS QUE C'EST PRÉSENT

  

  

  